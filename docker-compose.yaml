version: "3.9"

services:
  frontend:
    build:
      context: ./Frontend
    image: busbooking-frontend:latest
    container_name: frontend
    ports:
      - "4173:4173"
    environment:
      VITE_API_BASE_URL: http://backend:8080
    depends_on:
      - backend

  backend:
    build:
      context: ./Backend
    image: busbooking-backend:latest
    container_name: backend
    ports:
      - "8080:8080"
    environment:
      MONGO_URI: mongodb://mongo:27017/busbooking
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      - mongo
      - redis
      - rabbitmq

  mongo:
    image: mongo:8
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:8-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  mongo_data:
  redis_data:
  rabbitmq_data:

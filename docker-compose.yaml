version: "3.9"

networks:
  busbooking-net:
    external: true

services:
  frontend:
    build:
      context: ./Frontend
    image: busbooking-frontend:latest
    container_name: frontend
    restart: always
    ports:
      - "4173:4173"
    environment:
      # Frontend gọi backend qua docker network
      VITE_API_BASE_URL: http://backend:8080
    depends_on:
      - backend
    networks:
      - busbooking-net

  backend:
    build:
      context: ./Backend
    image: busbooking-backend:latest
    container_name: backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: ${NODE_ENV}

      # App
      APP_PRO_PORT: ${APP_PRO_PORT}

      # MongoDB (docker network)
      DB_PRO_HOST: ${DB_PRO_HOST}
      DB_PRO_PORT: ${DB_PRO_PORT}
      DB_PRO_USERNAME: ${DB_PRO_USERNAME}
      DB_PRO_PASSWORD: ${DB_PRO_PASSWORD}
      DB_PRO_NAME: ${DB_PRO_NAME}

      # Redis (docker network)
      REDIS_PRO_HOST: ${REDIS_PRO_HOST}
      REDIS_PRO_PORT: ${REDIS_PRO_PORT}

      # RabbitMQ (docker network)
      RABBITMQ_PRO_URL: ${RABBITMQ_PRO_URL}

      # Log path inside container
      LOG_FOLDER_PATH_BE: /app/logs

    networks:
      - busbooking-net

